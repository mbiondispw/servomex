  system: SAP
  document: 07930B1 VC.pdf
  sap_product: 07930B1
  sap_class: CLASS_7930B

target:
  product_sku: 07930B1
  product_classification_name: NGL Lase 3 (B1)

plan:
  path: datasets/sfdmu/servomex/en-US/servomex-sap-attributes

# Shared permitted-value sets. A characteristic points at one with `picklist:`
# instead of repeating the same options.
picklists:
