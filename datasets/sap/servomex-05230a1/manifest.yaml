# Approved product attribute migration manifest for the SERVOFLEX Mini MP
# Portable Analyser (SAP material 05230A1).
#
# Authoritative, human-reviewed input for
# scripts/ai/generate_sap_attribute_migration.py. The source is a Workbook
# Source, not a SAP classification export: provenance is sheet + cell, and there
# is no SAP Class, so codes are namespaced SMX-05230A1-<attribute>[-<value>].
#
# Source workbook: "5230A1 Product configuration and pricing.xlsx", supplied by
# Servomex. It is customer data and is not committed; every cell this manifest
# relies on is quoted verbatim in source.text. Multi-cell ranges join their
# cells with " | " in column order.
#
# Currency: every workbook price is GBP. The "Price USD" header (F1) is a
# mislabel (spec #32).
#
# Option Adders: every workbook option price (column F) is a `price` on its
# permitted value, cited by its F cell. Each becomes a flat GBP attribute-based
# price adjustment on the Mini MP line (#35). Unpriced values add nothing.
#
# The workbook's "Customer pricing" sheet (Channel Partner discounts) is
# discount data, not product attributes, and is out of scope for this manifest.

revision: 3

# Approved through spec #32 and tickets #33, #34 and #35, which fix the
# attributes, codes, defaults, list price, and option prices below. Values added beyond the workbook carry
# disposition: added and a reason, and no cell.
approval:
  approved: true
  approved_by: Martin Biondi
  approved_on: 2026-11-20

source:
  kind: workbook
  system: SMX
  document: 5230A1 Product configuration and pricing.xlsx
  sap_product: 05230A1

target:
  product_sku: 05230A1
  product_classification_name: SERVOFLEX Mini MP Portable Analyser
  list_price:
    amount: 4500
    currency: GBP
    pricebook: Standard Price Book
    selling_model: One-Time
    source:
      sheet: Product Config and Pricing
      cell: A2:F2
      text: "Base Analyser - 05230A1 - SERVOFLEX Mini MP Portable Analyser | 4500"
  option_adders:
    schedule: Standard Attribute Based Adjustment
    selling_model: One-Time
    currency: GBP
    effective_from: "2026-01-01T00:00:00.000+0000"

plan:
  path: datasets/sfdmu/servomex/en-US/servomex-minimp-05230a1
