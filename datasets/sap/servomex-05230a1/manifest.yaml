unresolved:
  - id: 05230A1-variant-discount
    reason: >-
      The workbook gives the Standard Variants "10% discount off total"
      (F5:F8). No variant discount is generated yet, so a Standard Variant
      prices at its full base plus Option Adders.
  - id: 05230A1-option-dependencies
    reason: >-
      The workbook's Attribute dependency (column B) and Option Dependency
      (column E) rules are not generated. They belong to the hand-authored
      MiniMP5200 Constraint Model, so no generated option combination is
      proven valid yet.
