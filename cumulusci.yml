minimum_cumulusci_version: '4.9.0'
project:
    name: servomex
    package:
        name: servomex
        api_version: '67.0'
    git:
        default_branch: 'main'
    source_format: sfdx

tasks:
    robot:
        options:
            suites: robot/servomex/tests
            options:
                outputdir: robot/servomex/results

    robot_testdoc:
        options:
            path: robot/servomex/tests
            output: robot/servomex/doc/servomex_tests.html

    run_tests:
        options:
            required_org_code_coverage_percent: 75

    deploy_servomex:
        group: Servomex
        description: Deploy this repo's source directory (force-app), which holds the Demo Inbox Address module and Send Proposal.
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: force-app

    rewrite_contact_emails_to_demo_inbox:
        group: Servomex
        description: >
            Give every Contact in the org a unique Demo Inbox Address
            (martin.biondi+<alias>@piercewashington.com), so no Proposal reaches a real
            customer, and report how many Contacts changed and were skipped. The alias is
            the email's local part, or firstname.lastname when another Contact shares it or
            the email is blank, with 2, 3, ... appended on a clash. Re-runnable: Contacts
            that already hold a Demo Inbox Address are skipped. Requires deploy_servomex.
            See scripts/apex/rewriteContactEmailsToDemoInbox.apex.
        class_path: tasks.rlm_apex_file.FileBasedAnonymousApexTask
        options:
            path: scripts/apex/rewriteContactEmailsToDemoInbox.apex

    assign_servomex_quote_page:
        group: Servomex
        description: >
            Assign Servomex_Quote_Record_Page (the Quote page with Send Proposal) as the
            Quote record page in the RLM_Revenue_Cloud app for the given profiles. Uses an
            app + profile assignment, the one layer rlm-base-dev's UX assembly doesn't
            write. Re-runnable.
        class_path: tasks.servomex_record_page.AssignRecordPageToProfiles
        options:
            api_names: RLM_Revenue_Cloud
            flexipage: Servomex_Quote_Record_Page
            sobject: Quote
            profiles: Admin

    create_backup_demo_quote:
        group: Servomex
        description: >-
            Create the NordicGas AS backup demo Quote (Lars Eriksson as Quote Contact, priced
            through Place Sales Transaction), or reset it to Draft when it exists. Needs the
            contact email rewrite to have run. Option dry_run=true only reads the org.
        class_path: tasks.backup_demo_quote.CreateBackupDemoQuote

flows:
    deploy_send_proposal:
        group: Servomex
        description: >
            Deploy Send Proposal (screen flow, Quote action, Servomex_Proposal email template,
            Servomex Quote page) and assign the page. Needs rlm-base-dev docgen in the org.
            See docs/features/send-proposal.md.
        steps:
            1:
                task: deploy_servomex
            2:
                task: assign_servomex_quote_page
