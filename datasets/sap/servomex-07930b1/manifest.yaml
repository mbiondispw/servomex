# Authoritative, human-reviewed input for
# scripts/ai/generate_sap_attribute_migration.py. Exact source text lives here;
# generated SFDMU CSVs carry ASCII-normalized operational values.

revision: 7

approval:
  approved: true
  approved_by: Martin Biondi
  approved_on: 2026-08-27

