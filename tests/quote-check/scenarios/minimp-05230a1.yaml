# Quote-check scenarios for the SERVOFLEX Mini MP Portable Analyser (05230A1).
#
# Each scenario creates one Quote in the target org and checks its priced lines.
# Prices are GBP. Run: python tests/quote-check/quote_check.py --org <sf-alias>
#
# accounts:   test accounts, created on first use and reused afterwards.
# scenarios:  name, account key, lines to quote, and what each line must show.
#   lines[].attributes         Attribute Definition Code -> value the rep picks.
#   expect.lines[].fields      QuoteLineItem field -> expected value.
#   expect.lines[].attributes  Attribute Definition Code -> value on the priced line.

accounts:
  direct:
    name: Quote Check - Direct Customer
    type: Customer
    currency: GBP

scenarios:
  - name: default-minimp-quotes-at-4500
    description: An unconfigured Mini MP takes its defaults and quotes at the 4500 GBP list price.
    account: direct
    lines:
      - sku: 05230A1
    expect:
      lines:
        - sku: 05230A1
          fields:
            ListPrice: 4500
            TotalPrice: 4500
          attributes:
            SMX-05230A1-CONFIGURATION: User Configured
            SMX-05230A1-SUPPLY_POWER: UK Mains

  - name: default-minimp-carries-every-attribute-default
    description: >-
      A newly configured Mini MP line carries every static attribute default
      (#34). Sampling System, mA Output, Probe Holder and Transport Case have
      no static default; the Constraint Model sets them.
    account: direct
    lines:
      - sku: 05230A1
    expect:
      lines:
        - sku: 05230A1
          attributes:
            SMX-05230A1-CONFIGURATION: User Configured
            SMX-05230A1-SUPPLY_POWER: UK Mains
            SMX-05230A1-MEASUREMENT_1: Oxygen, Standard Accuracy
            SMX-05230A1-MEASUREMENT_2: None
            SMX-05230A1-INLET_COUPLER: 1/4" Barb
            SMX-05230A1-EXHAUST_VENT_OUTLET: Rear Panel
            SMX-05230A1-USER_MANUAL: English
            SMX-05230A1-PRINTER: Not Supplied
            SMX-05230A1-VEHICLE_POWER_ADAPTOR: Supplied
            SMX-05230A1-SIDE_PANEL_ACCESSORIES: None
            SMX-05230A1-SAMPLE_PROBE: Not Supplied


  - name: battery-and-printer-add-their-option-adders
    description: >-
      Option Adders (#35): Rechargeable Battery UK (1292) and Printer Supplied
      (1521) on the 4500 base.
    account: direct
    lines:
      - sku: 05230A1
        attributes:
          SMX-05230A1-SUPPLY_POWER: Rechargeable Battery UK
          SMX-05230A1-PRINTER: Supplied
    expect:
      lines:
        - sku: 05230A1
          fields:
            TotalPrice: 7313
          attributes:
            SMX-05230A1-SUPPLY_POWER: Rechargeable Battery UK
            SMX-05230A1-PRINTER: Supplied

  - name: high-accuracy-dual-measurement-adds-its-option-adders
    description: >-
      Option Adders (#35): Oxygen High Accuracy (7534), Measurement 2 CO2 50% FS
      (4750) and 1/8" NPT inlet (99) on the 4500 base.
    account: direct
    lines:
      - sku: 05230A1
        attributes:
          SMX-05230A1-MEASUREMENT_1: Oxygen, High Accuracy
          SMX-05230A1-MEASUREMENT_2: CO2 50% FS
          SMX-05230A1-INLET_COUPLER: 1/8" NPT
    expect:
      lines:
        - sku: 05230A1
          fields:
            TotalPrice: 16883
          attributes:
            SMX-05230A1-MEASUREMENT_1: Oxygen, High Accuracy
            SMX-05230A1-MEASUREMENT_2: CO2 50% FS
            SMX-05230A1-INLET_COUPLER: 1/8" NPT

  # --- MiniMP5200 Constraint Model (#36) ------------------------------------
  # Prices are not asserted here; option pricing is a separate ticket.

  - name: minimp-rules-sv01-defaults
    description: SV01 derives its Standard Variant defaults; no side panel leaves Probe Holder empty.
    account: direct
    lines:
      - sku: 05230A1
        attributes:
          SMX-05230A1-CONFIGURATION: Standard Variant (SV01)
    expect:
      lines:
        - sku: 05230A1
          attributes:
            SMX-05230A1-CONFIGURATION: Standard Variant (SV01)
            # Measurement 1 = Oxygen, Industrial is not asserted: the engine cannot
            # match comma-bearing values, so the Oxygen rules are inert (follow-up).
            SMX-05230A1-MEASUREMENT_2: None
            SMX-05230A1-SAMPLING_SYSTEM: AFCD
            SMX-05230A1-MA_OUTPUT: Single
            SMX-05230A1-EXHAUST_VENT_OUTLET: Rear Panel
            SMX-05230A1-SIDE_PANEL_ACCESSORIES: None
            SMX-05230A1-PROBE_HOLDER: null
            SMX-05230A1-SAMPLE_PROBE: Not Supplied
            SMX-05230A1-TRANSPORT_CASE: Not Supplied

  - name: minimp-rules-a-dual-co2-pump-flow-meter-valve
    description: Two CO2 ranges with Internal Pump and Flow Meter + Valve derive Dual mA, the filter probe holder and a Transport Case.
    account: direct
    lines:
      - sku: 05230A1
        attributes:
          SMX-05230A1-CONFIGURATION: User Configured
          SMX-05230A1-MEASUREMENT_1: CO2 25% FS
          SMX-05230A1-MEASUREMENT_2: CO2 10% FS
          SMX-05230A1-SAMPLING_SYSTEM: Internal Pump
          SMX-05230A1-SIDE_PANEL_ACCESSORIES: Flow Meter + Valve
    expect:
      lines:
        - sku: 05230A1
          attributes:
            SMX-05230A1-MEASUREMENT_1: CO2 25% FS
            SMX-05230A1-MEASUREMENT_2: CO2 10% FS
            SMX-05230A1-SAMPLING_SYSTEM: Internal Pump
            SMX-05230A1-SIDE_PANEL_ACCESSORIES: Flow Meter + Valve
            SMX-05230A1-MA_OUTPUT: Dual
            SMX-05230A1-PROBE_HOLDER: "Supplied : Including Filter"
            SMX-05230A1-TRANSPORT_CASE: Supplied

  - name: minimp-rules-rejects-same-co2-range-twice
    description: >-
      Measurement 2 cannot repeat the Measurement 1 CO2 range. Place resolves the
      conflict silently, so the check is that the combination is not kept; the
      conflict message is a follow-up.
    account: direct
    lines:
      - sku: 05230A1
        attributes:
          SMX-05230A1-CONFIGURATION: User Configured
          SMX-05230A1-MEASUREMENT_1: CO2 25% FS
          SMX-05230A1-MEASUREMENT_2: CO2 25% FS
    expect:
      rejected: {}

  - name: minimp-rules-rejects-measurement-2-on-sv01
    description: Measurement 2 is only available for configuration A.
    account: direct
    lines:
      - sku: 05230A1
        attributes:
          SMX-05230A1-CONFIGURATION: Standard Variant (SV01)
          SMX-05230A1-MEASUREMENT_2: CO2 50% FS
    expect:
      rejected: {}

  - name: minimp-rules-rejects-sample-probe-without-side-panel
    description: A Sample Probe needs a side panel (and so a Probe Holder).
    account: direct
    lines:
      - sku: 05230A1
        attributes:
          SMX-05230A1-SIDE_PANEL_ACCESSORIES: None
          SMX-05230A1-SAMPLE_PROBE: 1m SS
    expect:
      rejected: {}

  - name: minimp-rules-rejects-flow-meter-with-internal-pump
    description: The Flow Meter panel is only available with AFCD.
    account: direct
    lines:
      - sku: 05230A1
        attributes:
          SMX-05230A1-CONFIGURATION: User Configured
          SMX-05230A1-SAMPLING_SYSTEM: Internal Pump
          SMX-05230A1-SIDE_PANEL_ACCESSORIES: Flow Meter
    expect:
      rejected: {}
