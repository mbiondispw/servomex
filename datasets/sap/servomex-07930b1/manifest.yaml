    description: Concentration unit shared by every sample gas component slot.
    disposition: generated
    disposition_reason: >-
      The ten Stream Component Units characteristics repeat one identical
      three-option unit set, so they share a single Attribute Picklist.
    source:
      page: 4
      text: "C7900_BG_COMP1_UNITS            Stream Component 1 Units"
    values:
      - code: "1"
        label: "% vol"
        disposition: generated
        source:
          page: 4
          text: "1                           % vol"
      - code: "2"
        label: "ppmv"
        disposition: generated
        source:
          page: 4
          text: "2                           ppmv"
      - code: "3"
        label: "mg/Nm3"
        disposition: generated
        source:
          page: 4
          text: "3                           mg/Nm3"

