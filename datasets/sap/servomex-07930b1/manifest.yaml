  - id: C7931_PRODUCT_RELEASED_2
    label: Product Released
    disposition: excluded
    disposition_reason: >-
      Release control listing which product options are released for SAP order
      entry. Its permitted values are release flags, and 12 of the 26 are
      explicitly deprecated ("- Not Used" on 002-011 and 016, "- NU" on 013),
      including the accessory flag "009 Alignment Tool - Not Used" that the
      retained C7900_ALIGNMENT_TOOLS choice supersedes. Neither the released nor
      the deprecated flags become selling choices, so none of them reach an
      active Revenue Cloud picklist.
    source:
      page: 1
      text: "C7931_PRODUCT_RELEASED_2        079301A1 Product Released"

  - id: C7900_P_BLOCK
