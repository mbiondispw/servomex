unresolved:
  - id: CLASS_7930B-dependencies
    reason: >-
      The source document flags SAP dependency and variant-condition logic
      through the Dep. column and icons, but does not contain the rules
      themselves. No Revenue Cloud constraints were generated, and no generated
      option combination is proven valid.
  - id: C7900B_TP01-measurement-1
    reason: >-
      The source supplies a Measurement 1, Range permitted-value set but no
      permitted values or data type for Measurement 1 itself, so the primary
      measured component is deferred and the retained range has no measured
      component to qualify.
