# Quote-check scenarios for the SERVOFLEX Mini MP Portable Analyser (05230A1).
#
# Each scenario creates one Quote in the target org and checks its priced lines.
# Prices are GBP. Run: python tests/quote-check/quote_check.py --org <sf-alias>
#
# accounts:   test accounts, created on first use and reused afterwards.
# scenarios:  name, account key, lines to quote, and what each line must show.
#   lines[].attributes         Attribute Definition Code -> value the rep picks.
#   expect.lines[].fields      QuoteLineItem field -> expected value.
#   expect.lines[].attributes  Attribute Definition Code -> value on the priced line.

accounts:
  direct:
    name: Quote Check - Direct Customer
    type: Customer
    currency: GBP

scenarios:
  - name: default-minimp-quotes-at-4500
    description: An unconfigured Mini MP takes its defaults and quotes at the 4500 GBP list price.
    account: direct
    lines:
      - sku: 05230A1
    expect:
      lines:
        - sku: 05230A1
          fields:
            ListPrice: 4500
            TotalPrice: 4500
          attributes:
            SMX-05230A1-CONFIGURATION: User Configured
            SMX-05230A1-SUPPLY_POWER: UK Mains

  - name: default-minimp-carries-every-attribute-default
    description: >-
      A newly configured Mini MP line carries every static attribute default
      (#34). Sampling System, mA Output, Probe Holder and Transport Case have
      no static default; the Constraint Model sets them.
    account: direct
    lines:
      - sku: 05230A1
    expect:
      lines:
        - sku: 05230A1
          attributes:
            SMX-05230A1-CONFIGURATION: User Configured
            SMX-05230A1-SUPPLY_POWER: UK Mains
            SMX-05230A1-MEASUREMENT_1: Oxygen, Standard Accuracy
            SMX-05230A1-MEASUREMENT_2: None
            SMX-05230A1-INLET_COUPLER: 1/4" Barb
            SMX-05230A1-EXHAUST_VENT_OUTLET: Rear Panel
            SMX-05230A1-USER_MANUAL: English
            SMX-05230A1-PRINTER: Not Supplied
            SMX-05230A1-VEHICLE_POWER_ADAPTOR: Supplied
            SMX-05230A1-SIDE_PANEL_ACCESSORIES: None
            SMX-05230A1-SAMPLE_PROBE: Not Supplied


  - name: battery-and-printer-add-their-option-adders
    description: >-
      Option Adders (#35): Rechargeable Battery UK (1292) and Printer Supplied
      (1521) on the 4500 base.
    account: direct
    lines:
      - sku: 05230A1
        attributes:
          SMX-05230A1-SUPPLY_POWER: Rechargeable Battery UK
          SMX-05230A1-PRINTER: Supplied
    expect:
      lines:
        - sku: 05230A1
          fields:
            TotalPrice: 7313
          attributes:
            SMX-05230A1-SUPPLY_POWER: Rechargeable Battery UK
            SMX-05230A1-PRINTER: Supplied

  - name: high-accuracy-dual-measurement-adds-its-option-adders
    description: >-
      Option Adders (#35): Oxygen High Accuracy (7534), Measurement 2 CO2 50% FS
      (4750) and 1/8" NPT inlet (99) on the 4500 base.
    account: direct
    lines:
      - sku: 05230A1
        attributes:
          SMX-05230A1-MEASUREMENT_1: Oxygen, High Accuracy
          SMX-05230A1-MEASUREMENT_2: CO2 50% FS
          SMX-05230A1-INLET_COUPLER: 1/8" NPT
    expect:
      lines:
        - sku: 05230A1
          fields:
            TotalPrice: 16883
          attributes:
            SMX-05230A1-MEASUREMENT_1: Oxygen, High Accuracy
            SMX-05230A1-MEASUREMENT_2: CO2 50% FS
            SMX-05230A1-INLET_COUPLER: 1/8" NPT
