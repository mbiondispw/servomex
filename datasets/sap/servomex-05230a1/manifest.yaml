unresolved:
  - id: 05230A1-option-prices
    reason: >-
      The workbook prices options in column F (for example Rechargeable Battery
      at 1292 GBP, F13:F15) and gives the Standard Variants "10% discount off
      total" (F5:F8). No option price adjustments or variant discount are
      generated yet, so every configuration prices at the 4500 GBP base.
  - id: 05230A1-option-dependencies
    reason: >-
      The workbook's Attribute dependency (column B) and Option Dependency
      (column E) rules are not generated. They belong to the hand-authored
      MiniMP5200 Constraint Model, so no generated option combination is
      proven valid yet.
